spring.config.import=optional:file:./opt/luminis/.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME}
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE}

spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE}
spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE}

springdoc.api-docs.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}
springdoc.use-fqn=${SPRINGDOC_USE_FQN}
app.swagger.local-only=${SWAGGER_LOCAL_ONLY}

app.jwt.enabled=${JWT_ENABLED}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS}
app.jwt.public-paths=${JWT_PUBLIC_PATHS}

app.seguridad.migracion-cifrado-enabled=${SEGURIDAD_MIGRACION_CIFRADO_ENABLED}
app.keystore.path=${SEGURIDAD_KEYSTORE_PATH}
app.keystore.password=${SEGURIDAD_KEYSTORE_PASSWORD}
app.keystore.alias=${SEGURIDAD_KEY_ALIAS}
app.keystore.key-password=${SEGURIDAD_KEY_PASSWORD}

app.luminis.socket.max-kb=${LUMINIS_SOCKET_MAX_KB}
app.luminis.socket.mensajes-por-segundo=${LUMINIS_SOCKET_MENSAJES_POR_SEGUNDO}
app.luminis.socket.rafaga=${LUMINIS_SOCKET_RAFAGA}
app.luminis.socket.conexiones-por-usuario=${LUMINIS_SOCKET_CONEXIONES_POR_USUARIO}
app.luminis.admin.usuario=${LUMINIS_ADMIN_USUARIO}
app.luminis.admin.contrasena=${LUMINIS_ADMIN_CONTRASENA}
app.luminis.admin.nombres=${LUMINIS_ADMIN_NOMBRES}
app.luminis.admin.apellidos=${LUMINIS_ADMIN_APELLIDOS}
app.luminis.admin.correo=${LUMINIS_ADMIN_CORREO}
app.luminis.admin.rol=${LUMINIS_ADMIN_ROL}
app.luminis.admin.cambiar-contrasena=${LUMINIS_ADMIN_CAMBIAR_CONTRASENA}
app.luminis.permisos.administracion=${LUMINIS_ADMIN_PERMISSIONS_RESOURCE}
app.luminis.permisos.clientes=${LUMINIS_CLIENTE_PERMISSIONS_RESOURCE}
app.luminis.cliente.rol-propietario=${LUMINIS_CLIENTE_ROL_PROPIETARIO}
